- name: demo on prompt
  hosts: local
  connection: local
  vars_prompt:
    - name: username
      prompt: "Please enter username"
      private: false # Value entered will be displayed 
    - name: password
      prompt: "Please enter password"
      private: true # Value entered won't be displayed
  tasks:
  - name: print information
    debug:
      msg: "Username is: {{ username }}, password is: {{ password }}"
